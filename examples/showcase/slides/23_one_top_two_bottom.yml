top:
  type: "code"
  title: "buffer_pool.cr — Direct Slice Ingestion"
  lang: "crystal"
  tag: "Zero-Alloc"
  density: "compact"
  code: |
    # Ingest network payload directly into static ring buffer slice:
    def process_frame(io : IO, buffer : Bytes) : Header
      bytes_read = io.read_fully?(buffer) || raise "Truncated frame stream"
      # Zero-copy header interpretation via pointer reinterpretation:
      header = buffer[0, 16].to_unsafe.as(Pointer(Header)).value
      header.validate!
      header
    end
