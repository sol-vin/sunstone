id: "faq"
layout: "faq"
badge: "LAYOUT: FAQ"
badge_color: "accent"
palette: "slate_dark"
title: "Frequently Addressed Questions"
subtitle: "Architectural decisions, workflow integration, and customization capabilities"
questions:
  - q: "Can I use custom Google Fonts or system typefaces?"
    badge: "TYPOGRAPHY"
    color: "accent"
    a: "Yes. Sunstone themes load fonts via standard CSS @import rules hoisted automatically to the stylesheet header with zero runtime Flash of Unstyled Text."
  - q: "How do I switch color palettes mid-presentation?"
    badge: "PALETTES"
    color: "emerald"
    a: "Simply specify 'palette: candy' or any of the 45+ registered palette IDs on individual slide YAML files. Sunstone dynamically rebinds CSS variables per section."
  - q: "Does Sunstone require npm or Node.js in CI?"
    badge: "PORTABILITY"
    color: "amber"
    a: "Zero Node.js runtime required. The single compiled Crystal binary generates static HTML & CSS with bundled vendor assets in under 300ms."
  - q: "How does Sunstone enforce zero inline styles?"
    badge: "ARCH"
    color: "purple"
    a: "Layouts emit purely semantic HTML tags and data attributes. The central engine in sunstone-base.css manages 100% of spatial Grid & Flexbox geometry."
notes: |
  Address audience questions and summarize the primary architectural benefits of Sunstone.
