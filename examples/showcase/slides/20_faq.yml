title: "Frequently Addressed Questions"
subtitle: "Architectural decisions, workflow integration, and customization capabilities"
questions:
  - q: "Can I use custom Google Fonts or system typefaces?"
    badge: "TYPOGRAPHY"
    color: "accent"
    a: "Yes. Sunstone themes load fonts via standard CSS @import rules hoisted automatically to the stylesheet header. Font families map to theme variables (--font-title, --font-body, --code-font) with zero runtime Flash of Unstyled Text."
  - q: "How do I switch color palettes mid-presentation?"
    badge: "PALETTES"
    color: "emerald"
    a: "Simply specify 'palette: candy' or any of the 45+ registered palette IDs on individual slide YAML files. Sunstone dynamically rebinds CSS custom properties per section and synchronizes interactive UI elements like the 3D isometric cube."
  - q: "Does Sunstone require npm or Node.js in CI?"
    badge: "PORTABILITY"
    color: "amber"
    a: "Zero Node.js runtime required. The standalone Crystal binary compiles entire presentations with bundled vendor assets in under 300ms, making GitHub Pages CI fast, lightweight, and deterministic."
  - q: "How does Sunstone enforce zero inline styles?"
    badge: "ARCH"
    color: "purple"
    a: "Layouts emit purely semantic HTML tags and data-* attributes (data-layout, data-density, data-ratio). The central engine in sunstone-base.css governs 100% of spatial Grid and Flexbox geometry without inline style battles."
notes: |
  Address audience questions and summarize the primary architectural benefits of Sunstone.
