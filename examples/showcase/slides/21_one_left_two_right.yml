left:
  type: "code"
  title: "scheduler.cr — Fiber Work-Stealing Engine"
  lang: "crystal"
  tag: "Crystal"
  code: |
    module Sunstone::Runtime
      class FiberPool
        def initialize(@workers : Int32 = System.cpu_count)
          @queue = Channel(Proc(Void)).new(1024)
          @workers.times { spawn worker_loop }
        end

        private def worker_loop
          while job = @queue.receive?
            job.call
          end
        end

        def dispatch(&block : -> Void)
          @queue.send(block)
        end
      end
    end
