id: "dual_mode"
layout: "dual-mode"
badge: "LAYOUT: DUAL-MODE"
badge_color: "nordic"
palette: "nordic_ice"
title: "Execution Mode Comparison"
subtitle: "Interactive side-by-side mode evaluation with tabular specs"
banner: "Choose the optimal pipeline for your development and production lifecycle."
modes:
  - title: "Local Live Preview"
    badge: "DEVELOPMENT"
    color: "accent"
    flow: "sunstone serve --port 8000"
    desc: "Instant feedback loop with hot asset recompilation and browser synchronization."
    specs:
      - icon: "bolt"
        label: "Startup Time"
        value: "< 50ms"
      - icon: "globe"
        label: "Port Hunting"
        value: "Automatic 8000..8020"
      - icon: "desktop"
        label: "Browser Launch"
        value: "OS Native"
      - icon: "terminal"
        label: "Dev Server"
        value: "Built-in Crystal HTTP"
  - title: "Production Static Build"
    badge: "CI / CD"
    color: "emerald"
    flow: "sunstone build --out dist"
    desc: "Single deterministic distribution directory ready for GitHub Pages or CDN."
    specs:
      - icon: "box"
        label: "Output Size"
        value: "< 1.5MB total"
      - icon: "shield"
        label: "Zero Dependencies"
        value: "Pure HTML/CSS/JS"
      - icon: "paper-plane"
        label: "Deployment"
        value: "GitHub Actions CI"
      - icon: "code"
        label: "Build Velocity"
        value: "< 300ms Compile"
summary: "Seamlessly transition from local slide drafting to production GitHub Pages deployment."
notes: |
  Contrast development ergonomics with production CI deployment efficiency.
